    function card(o,index){const t=text[lang],isChosen=choice===o.id,labels=[`${o.duration} min`,o.area[lang]];if(o.kind==='hotel')labels.push(t.filters.hotel);else if(o.kind==='head')labels.push(t.filters.head);else if(o.kind==='sensory')labels.push(t.filters.sensory);else labels.push(t.filters.body);const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.placeKey);return `<article class="card ${isChosen?'chosen':''}" data-card="${o.id}"><div class="visual" style="background:${palette[o.art]}"><svg viewBox="0 0 560 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${artLabel[o.art]}">${art[o.art]}</svg><div class="ordinal">0${index+1} / 06</div>${isChosen?`<div class="selected-chip">${t.selected}</div>`:''}</div><div class="card-body"><div class="card-kicker">${escapeHtml(o.area[lang])}</div><h3>${escapeHtml(o.names[lang])}</h3><p class="course">${escapeHtml(o.courses[lang])}</p><p class="summary">${escapeHtml(o.summary[lang])}</p><div class="meta">${labels.map(s=>`<span class="pill">${escapeHtml(s)}</span>`).join('')}</div><div class="subsection"><h4>${t.included}</h4><ul class="experience-list">${o.features[lang].map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ul></div><p class="for-you"><b>${t.ideal}：</b> ${escapeHtml(o.ideal[lang])}</p><div class="loc-block">${iconPin}<div><div class="loc-title">${escapeHtml(o.venue[lang])}</div><div class="loc-address">${escapeHtml(o.address)}</div><div class="loc-access">${escapeHtml(o.access[lang])}</div><div class="loc-access">${escapeHtml(o.hours[lang])}</div><div class="loc-access">${escapeHtml(o.other[lang])}</div></div></div><div class="actions"><button type="button" class="pick" data-pick="${o.id}" aria-pressed="${isChosen}">${isChosen?t.selected:t.choose}</button><a class="mapbtn" href="${map}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(o.venue[lang])} - ${t.map}">${t.map}</a></div></div></article>`}
    function render(){const t=text[lang];document.documentElement.lang=lang;document.title=lang==='ja'?'あなたへの贈りもの | 癒やしの時間':'A Little Time for You | Spa Gift Experiences';$('lang-ja').setAttribute('aria-pressed',String(lang==='ja'));$('lang-en').setAttribute('aria-pressed',String(lang==='en'));$('hero-heading').innerHTML=t.heroTitle;$('hero-description').textContent=t.heroDescription;$('hero-cta').innerHTML=t.heroCta;$('list-kicker').textContent=t.listKicker;$('list-title').textContent=t.listTitle;$('list-desc').textContent=t.listDesc;$('how-kicker').textContent=t.howKicker;$('how-title').textContent=t.howTitle;$('how-description').textContent=t.howDescription;$('steps').innerHTML=t.steps.map((x,i)=>`<div class="step"><b>0${i+1}</b><p>${escapeHtml(x)}</p></div>`).join('');$('footer').textContent=t.footer;$('filters').innerHTML=Object.entries(t.filters).map(([k,v])=>`<button class="filter ${k===category?'active':''}" type="button" data-filter="${k}" aria-pressed="${k===category}">${v}</button>`).join('');$('cards').innerHTML=options.filter(o=>category==='all'||categoriesFor(o).includes(category)).map(o=>card(o,options.indexOf(o))).join('');$('copy-btn').textContent=t.copy;$('line-btn').textContent=t.line;$('tray-label').textContent=t.tray;renderTray()}
    function selectedMessage(o){return text[lang].share.replace('{name}',o.names[lang]).replace('{course}',o.courses[lang]).replace('{place}',o.venue[lang])}
    function renderTray(){const o=options.find(o=>o.id===choice);$('tray').classList.toggle('show',!!o);if(!o)return;$('tray-title').textContent=o.names[lang]+' · '+o.courses[lang];$('line-btn').href='https://line.me/R/msg/text/?'+encodeURIComponent(selectedMessage(o))}
    function choose(id){choice=choice===id?null:id;render();if(choice){const tray=$('tray');tray.classList.add('show')}else $('tray').classList.remove('show')}

    function fallbackCopy(s){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
    document.addEventListener('click',async e=>{const filter=e.target.closest('[data-filter]');if(filter){category=filter.dataset.filter;render();return}const pick=e.target.closest('[data-pick]');if(pick){choose(pick.dataset.pick);return}});
    $('lang-ja').addEventListener('click',()=>{lang='ja';render()});$('lang-en').addEventListener('click',()=>{lang='en';render()});$('clear-btn').addEventListener('click',()=>{choice=null;render()});$('copy-btn').addEventListener('click',async()=>{const o=options.find(o=>o.id===choice);if(!o)return;const s=selectedMessage(o);let copied=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(s);copied=true}}catch(e){}if(!copied)copied=fallbackCopy(s);if(copied)flash(text[lang].copied);else prompt(text[lang].copyFallback,s)});
    render();
  })();
  </script>
</body>
</html>
